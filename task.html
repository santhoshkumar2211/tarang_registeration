
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarang Event - Task Manager</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            max-width: 750px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .heading {
            text-align: center;
            background: linear-gradient(135deg, #ff512f, #dd2476);
            color: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .heading h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .heading p {
            font-size: 14px;
        }

        .task-input {
            margin-bottom: 30px;
        }

        .task-input label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .task-input input {
            width: 75%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        .task-input input:focus {
            border-color: #dd2476;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            margin: 5px;
        }

        .submit-btn {
            background: #dd2476;
        }

        .submit-btn:hover {
            background: #b8175d;
        }

        .task-section h2 {
            color: #243b55;
            margin-bottom: 15px;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            background: #f4f6f9;
            padding: 15px;
            margin-bottom: 12px;
            border-left: 5px solid #dd2476;
            border-radius: 8px;
        }

        .task-item h3 {
            color: #333;
            flex: 1;
            overflow-wrap: anywhere;
        }

        .edit-btn {
            background: #f39c12;
        }

        .delete-btn {
            background: #e74c3c;
        }

        .edit-btn:hover {
            background: #d68910;
        }

        .delete-btn:hover {
            background: #c0392b;
        }

        .task-count {
            margin-bottom: 15px;
            color: #555;
            font-weight: bold;
        }

        #empty {
            text-align: center;
            color: #888;
            padding: 20px;
        }

        @media(max-width: 550px) {
            .container {
                padding: 20px;
            }

            .heading h1 {
                font-size: 25px;
            }

            .task-input input {
                width: 100%;
                margin-bottom: 10px;
            }

            .task-input button {
                width: 100%;
                margin: 0;
            }

            .task-item {
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="heading">
            <h1>TARANG EVENT</h1>
            <p>Event Management Task Manager</p>
        </div>

        <div class="task-input">

            <label>Event Task Name:</label>

            <input type="text" id="input"
                placeholder="Enter your event task">

            <button class="submit-btn" onclick="createTask()">
                Add Task
            </button>

        </div>

        <div class="task-section">

            <h2>Event Task List</h2>

            <p class="task-count" id="count">Total Tasks: 0</p>

            <div class="task-list" id="list">
                <p id="empty">No tasks added yet!</p>
            </div>

        </div>

    </div>

    <script>

        function createTask() {

            let task = document.getElementById("input");

            if (task.value.trim() == "") {
                alert("Enter the event task");
                return;
            }

            let div = document.createElement("div");
            div.className = "task-item";

            let h3 = document.createElement("h3");
            h3.innerText = task.value.trim();

            let editBtn = document.createElement("button");
            editBtn.innerText = "Edit";
            editBtn.className = "edit-btn";

            editBtn.onclick = function() {

                let newTask = prompt("Edit your event task", h3.innerText);

                if (newTask != null && newTask.trim() != "") {
                    h3.innerText = newTask.trim();
                }

            };

            let deleteBtn = document.createElement("button");
            deleteBtn.innerText = "Delete";
            deleteBtn.className = "delete-btn";

            deleteBtn.onclick = function() {
                div.remove();
                updateCount();
            };

            div.appendChild(h3);
            div.appendChild(editBtn);
            div.appendChild(deleteBtn);

            document.getElementById("list").appendChild(div);

            task.value = "";

            updateCount();

        }

        function updateCount() {

            let total = document.querySelectorAll(".task-item").length;

            document.getElementById("count").innerText =
                "Total Tasks: " + total;

            let empty = document.getElementById("empty");

            if (total == 0) {
                empty.style.display = "block";
            } else {
                empty.style.display = "none";
            }

        }

    </script>

</body>
</html>
